<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Pong — Arcade</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07111f;
        color: #e8f4ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 35%, #122843 0%, #07111f 70%);
      }

      main { width: min(100%, 900px); }

      .topbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin: 0 0 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .scoreboard {
        display: flex;
        align-items: center;
        gap: clamp(18px, 5vw, 44px);
        font-variant-numeric: tabular-nums;
      }

      .score { text-align: center; }
      .score-label { display: block; color: #9fb6ce; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
      .score-value { color: #7cf6d2; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 750; line-height: 1.15; }
      .score-divider { color: #47627b; font-size: 1.4rem; }

      .arena {
        overflow: hidden;
        border: 1px solid #28435e;
        border-radius: 14px;
        background: #081522;
        box-shadow: 0 24px 70px #0008, 0 0 40px #27d9b311;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 8 / 5;
        touch-action: none;
        cursor: crosshair;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 16px;
      }

      .hint { margin: 0; color: #a7bad0; font-size: 0.9rem; line-height: 1.5; }
      kbd {
        padding: 2px 6px;
        border: 1px solid #3b566e;
        border-radius: 5px;
        background: #102237;
        color: #e8f4ff;
        font: inherit;
        font-size: 0.82em;
      }

      button {
        flex: 0 0 auto;
        padding: 9px 16px;
        border: 1px solid #48d9b3;
        border-radius: 8px;
        background: #10392f;
        color: #e8fff8;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover { background: #165343; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

      @media (max-width: 520px) {
        body { padding: 18px 12px; }
        .topbar { align-items: center; }
        .controls { align-items: flex-start; }
        .hint { font-size: 0.8rem; }
        button { padding: 8px 11px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <h1>Pong</h1>
        <div class="scoreboard" aria-label="Score">
          <div class="score"><span class="score-label">You</span><span class="score-value" id="player-score">0</span></div>
          <span class="score-divider" aria-hidden="true">:</span>
          <div class="score"><span class="score-label">Computer</span><span class="score-value" id="computer-score">0</span></div>
        </div>
      </header>

      <div class="arena">
        <canvas id="game" width="800" height="500" aria-label="Pong game. Move your paddle with the mouse or the up and down arrow keys." role="img"></canvas>
      </div>

      <div class="controls">
        <p class="hint" id="game-status" aria-live="polite">Move your mouse over the court or use <kbd>↑</kbd> and <kbd>↓</kbd> to play.</p>
        <button id="restart" type="button">New game</button>
      </div>
    </main>

    <script>
      (() => {
        const canvas = document.querySelector("#game");
        const context = canvas.getContext("2d");
        const playerScoreElement = document.querySelector("#player-score");
        const computerScoreElement = document.querySelector("#computer-score");
        const statusElement = document.querySelector("#game-status");
        const restartButton = document.querySelector("#restart");

        const width = canvas.width;
        const height = canvas.height;
        const paddleWidth = 12;
        const paddleHeight = 92;
        const ballSize = 12;
        const player = { x: 28, y: (height - paddleHeight) / 2, score: 0 };
        const computer = { x: width - 28 - paddleWidth, y: (height - paddleHeight) / 2, score: 0 };
        const ball = { x: width / 2, y: height / 2, vx: 5, vy: 2.5 };
        const keys = new Set();
        let paused = false;
        let lastFrame = 0;
        let pointPause = 0;

        function centerBall(direction = Math.random() < 0.5 ? -1 : 1) {
          ball.x = width / 2;
          ball.y = height / 2;
          const angle = (Math.random() * 0.8 - 0.4) * Math.PI / 2;
          const speed = 5;
          ball.vx = Math.cos(angle) * speed * direction;
          ball.vy = Math.sin(angle) * speed;
        }

        function movePlayer(delta) {
          const keyboardDirection = Number(keys.has("ArrowDown")) - Number(keys.has("ArrowUp"));
          if (keyboardDirection) {
            player.y += keyboardDirection * 7 * delta;
          }
          player.y = Math.max(0, Math.min(height - paddleHeight, player.y));
        }

        function moveComputer(delta) {
          const target = ball.vx > 0 ? ball.y - paddleHeight / 2 : height / 2 - paddleHeight / 2;
          const difference = target - computer.y;
          const speed = 4.2 * delta;
          computer.y += Math.max(-speed, Math.min(speed, difference));
          computer.y = Math.max(0, Math.min(height - paddleHeight, computer.y));
        }

        function intersectsPaddle(paddle) {
          return ball.x < paddle.x + paddleWidth && ball.x + ballSize > paddle.x &&
            ball.y < paddle.y + paddleHeight && ball.y + ballSize > paddle.y;
        }

        function update(delta) {
          if (paused || pointPause > 0) {
            pointPause = Math.max(0, pointPause - delta);
            return;
          }

          movePlayer(delta);
          moveComputer(delta);
          ball.x += ball.vx * delta;
          ball.y += ball.vy * delta;

          if (ball.y <= 0) {
            ball.y = 0;
            ball.vy = Math.abs(ball.vy);
          } else if (ball.y + ballSize >= height) {
            ball.y = height - ballSize;
            ball.vy = -Math.abs(ball.vy);
          }

          if (ball.vx < 0 && intersectsPaddle(player)) {
            ball.x = player.x + paddleWidth;
            bounceFromPaddle(player, 1);
          } else if (ball.vx > 0 && intersectsPaddle(computer)) {
            ball.x = computer.x - ballSize;
            bounceFromPaddle(computer, -1);
          }

          if (ball.x + ballSize < 0) {
            computer.score += 1;
            computerScoreElement.textContent = computer.score;
            statusElement.textContent = "Computer scores! Rally again.";
            pointPause = 35;
            centerBall(-1);
          } else if (ball.x > width) {
            player.score += 1;
            playerScoreElement.textContent = player.score;
            statusElement.textContent = "You score! Rally again.";
            pointPause = 35;
            centerBall(1);
          }
        }

        function bounceFromPaddle(paddle, direction) {
          const paddleCenter = paddle.y + paddleHeight / 2;
          const impact = (ball.y + ballSize / 2 - paddleCenter) / (paddleHeight / 2);
          const angle = impact * (Math.PI / 3);
          const speed = Math.min(9, Math.hypot(ball.vx, ball.vy) + 0.25);
          ball.vx = Math.cos(angle) * speed * direction;
          ball.vy = Math.sin(angle) * speed;
        }

        function draw() {
          context.fillStyle = "#081522";
          context.fillRect(0, 0, width, height);

          context.strokeStyle = "#294158";
          context.setLineDash([9, 12]);
          context.lineWidth = 3;
          context.beginPath();
          context.moveTo(width / 2, 0);
          context.lineTo(width / 2, height);
          context.stroke();
          context.setLineDash([]);

          context.fillStyle = "#7cf6d2";
          context.fillRect(player.x, player.y, paddleWidth, paddleHeight);
          context.fillStyle = "#81aaff";
          context.fillRect(computer.x, computer.y, paddleWidth, paddleHeight);
          context.fillStyle = "#f4fbff";
          context.fillRect(ball.x, ball.y, ballSize, ballSize);

          if (paused) {
            context.fillStyle = "#07111fcc";
            context.fillRect(0, 0, width, height);
            context.fillStyle = "#f4fbff";
            context.font = "700 32px system-ui, sans-serif";
            context.textAlign = "center";
            context.fillText("PAUSED", width / 2, height / 2);
          }
        }

        function frame(timestamp) {
          const delta = lastFrame ? Math.min((timestamp - lastFrame) / (1000 / 60), 2) : 1;
          lastFrame = timestamp;
          update(delta);
          draw();
          requestAnimationFrame(frame);
        }

        function setPlayerFromPointer(event) {
          const bounds = canvas.getBoundingClientRect();
          const scaleY = height / bounds.height;
          player.y = (event.clientY - bounds.top) * scaleY - paddleHeight / 2;
          player.y = Math.max(0, Math.min(height - paddleHeight, player.y));
        }

        canvas.addEventListener("pointermove", setPlayerFromPointer);
        window.addEventListener("keydown", (event) => {
          if (event.key === "ArrowUp" || event.key === "ArrowDown") {
            event.preventDefault();
            keys.add(event.key);
          }
          if (event.key.toLowerCase() === "p") {
            paused = !paused;
            statusElement.textContent = paused ? "Game paused. Press P to resume." : "Game resumed.";
          }
        });
        window.addEventListener("keyup", (event) => keys.delete(event.key));
        window.addEventListener("blur", () => keys.clear());

        restartButton.addEventListener("click", () => {
          player.score = 0;
          computer.score = 0;
          playerScoreElement.textContent = "0";
          computerScoreElement.textContent = "0";
          player.y = (height - paddleHeight) / 2;
          computer.y = (height - paddleHeight) / 2;
          paused = false;
          pointPause = 0;
          centerBall();
          statusElement.textContent = "New game started. Good luck!";
        });

        centerBall();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
